# ---------------------------------------------------------------------------
# brightsky — домашний хост (Windows, Docker Desktop, 192.168.1.43)
# ---------------------------------------------------------------------------
# Двусторонняя схема с starlight: portainer ниже управляет и brightsky, и
# (через агента на starlight) starlight'ом тоже, а portainer_agent даёт
# panel'и на starlight видеть brightsky.
# ---------------------------------------------------------------------------
services:
  # ---------------------------------------------------------------------------
  # Portainer — панель управления Docker brightsky.
  # UI: https://192.168.1.43:9443 (self-signed сертификат, доступ только по LAN)
  # Чтобы видеть starlight отсюда: Environments → Add environment →
  # Docker Standalone → Agent → 192.168.1.99:9001.
  #
  # ВНИМАНИЕ: до этого коммита portainer-ce на brightsky уже был поднят
  # вручную (не через compose). Перед `docker compose up -d` останови и
  # удали тот контейнер (`docker rm -f <старое-имя>`), иначе будет конфликт
  # портов 8000/9443. Админ-аккаунт/данные из старого контейнера не
  # перенесутся автоматически — создай новый при первом заходе на :9443.
  #
  # Актуальные теги: https://hub.docker.com/r/portainer/portainer-ce/tags
  # ---------------------------------------------------------------------------
  portainer:
    image: portainer/portainer-ce:latest
    container_name: brightsky_portainer
    restart: always
    ports:
      - "9443:9443"
      - "8000:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data

  # ---------------------------------------------------------------------------
  # Portainer Agent — публикует docker.sock brightsky на порт 9001, чтобы
  # его видел Portainer на starlight (Environments → Add environment →
  # Docker Standalone → Agent → 192.168.1.43:9001).
  # Актуальные теги: https://hub.docker.com/r/portainer/agent/tags
  # ---------------------------------------------------------------------------
  portainer_agent:
    image: portainer/agent:latest
    container_name: brightsky_portainer_agent
    restart: always
    ports:
      - "9001:9001"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes

  # ---------------------------------------------------------------------------
  # cAdvisor — метрики контейнеров (CPU/RAM/сеть/диск по каждому контейнеру),
  # скрейпится Prometheus'ом на luigi (job "cadvisor", см.
  # luigi/prometheus/prometheus.yml). Дашборд — в Grafana на luigi.
  # На Docker Desktop (WSL2) видит cgroups/докер внутри Linux-VM, поэтому метрики
  # диска — по виртуальному диску VM, не по физическим Windows-дискам.
  #
  # ВАЖНО: на v0.49.1 (как в C:\dev\ec-leasing\common\docker, но там классический
  # Linux-хост) здесь падало с "Failed to create existing container: ... failed
  # to identify the read-write layer ID" — Docker Desktop использует containerd
  # snapshotter вместо overlay2-графдрайвера (`docker inspect --format
  # '{{.GraphDriver}}'` → null), контейнер при этом "healthy", но без разбивки
  # по контейнерам (только агрегаты /docker, /kubepods). Поддержка
  # containerd-snapshotter добавлена в cAdvisor начиная с v0.54 (issue #3643,
  # PR #3709) — фикс: версия образа v0.60.5+, никаких доп. флагов не нужно.
  # Подтверждено на starlight (2026-08-16): 0 ошибок в логе, имена контейнеров
  # резолвятся корректно, см. starlight/docker-compose.yml.
  # Актуальные теги: https://github.com/google/cadvisor/releases
  # ---------------------------------------------------------------------------
  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.5
    container_name: brightsky_cadvisor
    restart: always
    privileged: true
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg

  # ---------------------------------------------------------------------------
  # Technitium DNS Server — локальный DNS для домашней сети 192.168.1.0/24.
  # Цель: резолвить голые хостнеймы (brightsky, starlight, luigi — без домена,
  # как они уже используются в prometheus.yml/README) через нормальный DNS,
  # а не через Windows NetBIOS/mDNS (не видно с Linux-хостов/контейнеров/из-за
  # прокси, см. историю с HTTP_PROXY и luigi:9090 — 2026-08-16).
  #
  # После первого поднятия — настройка руками через web-консоль
  # (https://192.168.1.43:5380, при первом заходе создать admin-пароль):
  #   1. Settings → Forwarders → добавить 1.1.1.1, 8.8.8.8 (или свои).
  #   2. Settings → Recursion → "Allow Only For Private Networks" (не открытый
  #      резолвер наружу).
  #   3. Zones → Add Zone → Primary Zone — создать 3 зоны: "brightsky",
  #      "starlight", "luigi" (имя зоны = сам хостнейм, без точки в конце).
  #      В каждой зоне добавить A-запись на "@" со значением IP хоста:
  #        brightsky → 192.168.1.43
  #        starlight → 192.168.1.99
  #        luigi     → 192.168.1.143
  #   4. На роутере (192.168.1.1, Keenetic) прописать 192.168.1.43 как DNS-
  #      сервер, выдаваемый DHCP-клиентам домашней сети — тогда все устройства
  #      в 192.168.1.0/24 резолвят brightsky/starlight/luigi «из коробки».
  #      Второй роутер (192.168.1.91, сеть 192.168.2.0/24) — аналогично, если
  #      нужно резолвить эти имена и оттуда (см. reference_home_network_routing).
  #   5. ВАЖНО: My Networks and Wi-Fi → сегмент → снять "Enable IPv6" (или
  #      явно прописать "DNS IPv6 server 1/2"). Иначе Keenetic по умолчанию
  #      сам рекламирует себя как IPv6 DNS через Router Advertisement — у
  #      клиентов получается 2 DNS-сервера (наш IPv4 + роутер по IPv6), они
  #      резолвят вразнобой, и один и тот же хостнейм то резолвится, то даёт
  #      NXDOMAIN в зависимости от того, какой сервер ответил первым.
  #      Обнаружено и исправлено 2026-08-16 (телефон на Wi-Fi: то luigi, то
  #      starlight, то brightsky — NXDOMAIN не пойми от чего; см. dumpsys wifi
  #      → DnsAddresses содержал fe80::.../wlan0 = сам роутер, у него зон нет).
  #   6. Плюс зона "home" (Primary Zone "home", записи brightsky/starlight/luigi
  #      → те же IP) — то же самое, но с суффиксом (brightsky.home и т.п.).
  #      Заодно чинит другой баг: встроенный DNS-прокси Docker Desktop
  #      (nameserver 192.168.65.7 в /etc/resolv.conf контейнеров) не резолвит
  #      голое имя СВОЕГО ЖЕ хоста (например, "starlight" внутри контейнера,
  #      запущенного на starlight, — "No answer"), а с суффиксом ".home"
  #      резолвит нормально. Голые зоны (п.3) не трогать — используются
  #      снаружи Docker (prometheus.yml и т.д.), просто предпочитать
  #      *.home внутри compose/контейнеров, где это тот же хост.
  #
  # Порт 53 наружу (на роутере) не пробрасывать — только LAN.
  # Актуальные теги: https://hub.docker.com/r/technitium/dns-server/tags
  # ---------------------------------------------------------------------------
  dns:
    image: technitium/dns-server:latest
    container_name: brightsky_dns
    hostname: brightsky-dns
    restart: always
    ports:
      - "5380:5380/tcp" # web-консоль (HTTP)
      - "53:53/udp"
      - "53:53/tcp"
    environment:
      - DNS_SERVER_DOMAIN=brightsky-dns
      - DNS_SERVER_LOG_FOLDER_PATH=/var/log/technitium/dns
    volumes:
      - dns_config:/etc/dns
      - dns_logs:/var/log/technitium/dns

volumes:
  portainer_data:
  dns_config:
  dns_logs: