# Сервисы этого хоста (2283/8765/8767/8768/5000/9554 и т.п.) — все опубликованы
# на хосте (docker-compose `ports:` в соответствующих репозиториях), поэтому
# адресуются как brightsky.home, а не по docker-network/container-name: frpc
# живёт в отдельном docker-compose проекте, не в сети Immich/Frigate, и не
# должен от них зависеть. "brightsky" (без .home) не резолвится в контейнере
# на самом brightsky (self-lookup через Docker Desktop DNS-прокси не работает,
# см. brightsky/docker-compose.yml, сервис dns) — только "brightsky.home".

[[proxies]]
name = "immich-server"
type = "tcp"
localIP = "brightsky.home"
localPort = 2283
remotePort = 2283

[[proxies]]
name = "face-search"
type = "tcp"
localIP = "brightsky.home"
localPort = 8765
remotePort = 8765

[[proxies]]
name = "face-finder"
type = "tcp"
localIP = "brightsky.home"
localPort = 8767
remotePort = 8767

[[proxies]]
name = "frigate-ui"
type = "tcp"
localIP = "brightsky.home"
localPort = 5000
remotePort = 5000

[[proxies]]
name = "frigate-rtsp"
type = "tcp"
localIP = "brightsky.home"
localPort = 9554
remotePort = 9554

[[proxies]]
name = "video-search"
type = "tcp"
localIP = "brightsky.home"
