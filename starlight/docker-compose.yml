# ---------------------------------------------------------------------------
# starlight — хост 192.168.1.99 (Windows, Docker Desktop)
# ---------------------------------------------------------------------------
# frpc — FRP-клиент, пробрасывает локальные сервисы этого хоста (TightVNC:5900,
# Ollama:11434) через frps на vkosarev.name:7401 → доступны на vkosarev.name как
# localhost:5900 / localhost:11434
# (см. .ai/2026.03.25-vkosarev.name-Services-Audit.md, раздел "starlight-vnc").
#
# Туннели starlight-* исторически нёс frpc на хосте brightsky (по LAN до
# 192.168.1.99, см. local/tools/immich/docker/frpc.ini) — с 2026-07-14 там
# остановлен, регистрацию держит только этот клиент, запущенный прямо на
# starlight.
#
# localIP = host.docker.internal — TightVNC слушает на хосте Windows
# (0.0.0.0:5900), не в контейнере; Docker Desktop резолвит host.docker.internal
# на хост из контейнеров "из коробки".
#
# Конфиг в формате TOML (ini — deprecated в frp).
# Актуальные теги: https://hub.docker.com/r/snowdreamtech/frpc/tags
# ---------------------------------------------------------------------------
services:
  frpc:
    image: snowdreamtech/frpc
    container_name: starlight_frpc
    restart: always
    volumes:
      - ./frpc.toml:/etc/frp/frpc.toml:ro
    entrypoint: /usr/bin/frpc
    command: ["-c", "/etc/frp/frpc.toml"]

  # ---------------------------------------------------------------------------
  # Portainer — панель управления Docker starlight. Двусторонняя схема с
  # brightsky: этот portainer видит brightsky через его portainer_agent
  # (Environments → Add environment → Docker Standalone → Agent → 192.168.1.43:9001),
  # а portainer_agent ниже в этом файле даёт brightsky.portainer видеть starlight.
  # UI: https://192.168.1.99:9443 (self-signed сертификат самого Portainer —
  # публичного домена/TLS-сертификата у starlight нет, доступ только по LAN)
  # Актуальные теги: https://hub.docker.com/r/portainer/portainer-ce/tags
  # ---------------------------------------------------------------------------
  portainer:
    image: portainer/portainer-ce:latest
    container_name: starlight_portainer
    restart: always
    ports:
      - "9443:9443"
      - "8000:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data

  # ---------------------------------------------------------------------------
  # Portainer Agent — публикует docker.sock starlight на порт 9001, чтобы
  # его видел Portainer на brightsky (Environments → Add environment →
  # Docker Standalone → Agent → 192.168.1.99:9001).
  # Актуальные теги: https://hub.docker.com/r/portainer/agent/tags
  # ---------------------------------------------------------------------------
  portainer_agent:
    image: portainer/agent:latest
    container_name: starlight_portainer_agent
    restart: always
    ports:
      - "9001:9001"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes

  # ---------------------------------------------------------------------------
  # cAdvisor — метрики контейнеров (CPU/RAM/сеть/диск по каждому контейнеру),
  # скрейпится Prometheus'ом на luigi (job "cadvisor", см.
  # luigi/prometheus/prometheus.yml). Дашборд — в Grafana на luigi.
  # На Docker Desktop (WSL2) видит cgroups/докер внутри Linux-VM, поэтому метрики
  # диска — по виртуальному диску VM, не по физическим Windows-дискам.
  #
  # ВАЖНО: на v0.49.1 (как в C:\dev\ec-leasing\common\docker, но там классический
  # Linux-хост) здесь падало с "Failed to create existing container: ... failed
  # to identify the read-write layer ID" — Docker Desktop использует containerd
  # snapshotter вместо overlay2-графдрайвера (`docker inspect --format
  # '{{.GraphDriver}}'` → null), контейнер при этом "healthy", но без разбивки
  # по контейнерам (только агрегаты /docker, /kubepods). Поддержка
  # containerd-snapshotter добавлена в cAdvisor начиная с v0.54 (issue #3643,
  # PR #3709) — фикс: версия образа v0.60.5+, никаких доп. флагов не нужно.
  # Проверено на starlight (2026-08-16): 0 ошибок в логе, имена контейнеров
  # (frigate, starlight_portainer, ...) резолвятся корректно.
  # Актуальные теги: https://github.com/google/cadvisor/releases
  # ---------------------------------------------------------------------------
  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.5
    container_name: starlight_cadvisor
    restart: always
    privileged: true
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg

volumes:
  portainer_data:
