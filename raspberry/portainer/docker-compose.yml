# Portainer на Raspberry Pi: описание того, что сейчас запущено на плате (был поднят вручную
# через `docker run`). Том portainer_data уже существует — используем его как есть, чтобы
# не потерять пользователей и настройки Portainer.
# На плате НЕ применялось. Чтобы перейти на compose: `docker rm -f portainer` (том останется),
# затем `docker compose up -d` в этом каталоге.
services:
  portainer:
    image: portainer/portainer-ce:lts
    container_name: portainer
    restart: always
    ports:
      - "8000:8000"
      - "9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data

volumes:
  portainer_data:
    external: true
