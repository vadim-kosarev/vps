# Основной dnsmasq: DHCP + настоящий DNS (для клиентов, авторизованных на портале).
# Неавторизованных клиентов wifi-fw.sh перенаправляет на портальный dnsmasq (dnsmasq-portal.conf).
interface=wlan1
bind-interfaces
dhcp-range=192.168.50.10,192.168.50.100,255.255.255.0,24h
local-ttl=60

# Настоящий DNS выше по цепочке (не resolv.conf: в контейнере с host-сетью он пустой)
no-resolv
server=1.1.1.1
server=8.8.8.8
server=77.88.8.8
domain-needed
bogus-priv
stop-dns-rebind
cache-size=1000

# Локальные имена портала
address=/get.me.home.local/192.168.50.1
address=/taxi.vkosarev.link/192.168.50.1
address=/mult.taxi/192.168.50.1
address=/mult.taxi52/192.168.50.1
address=/taxi52/192.168.50.1
address=/taxi.52/192.168.50.1
