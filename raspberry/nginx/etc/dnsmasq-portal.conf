# Портальный DNS для НЕавторизованных клиентов: любое имя -> точка доступа, поэтому
# проверки связи телефонов (connectivitycheck и т.п.) попадают на портал и показывают окно входа.
# Клиенты сюда попадают через REDIRECT 53 -> 5354 в wifi-fw.sh; авторизованные ходят в основной dnsmasq.
# DHCP тут нет (только DNS).
port=5354
listen-address=192.168.50.1
bind-interfaces
no-resolv
no-hosts
local-ttl=60
address=/#/192.168.50.1
# На AAAA (IPv6) отвечать пустым ответом, а не REFUSED (при no-resolv без upstream dnsmasq иначе отказывает)
local=/#/
